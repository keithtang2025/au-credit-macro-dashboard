name: Publish static site

on:
  # rebuild after every data refresh, after code changes, or by hand
  workflow_run:
    workflows: ["Refresh data snapshot"]
    types: [completed]
  push:
    branches: [main]
    paths: ["app.py", "src/**", "scripts/build_static.py", "assets/**", "data/manual/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the refresh commits new data to main; build from that, not the triggering commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
