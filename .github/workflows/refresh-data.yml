name: Refresh data snapshot

on:
  schedule:
    # 22:17 UTC daily = 9:17am Sydney (AEDT), after ABS/RBA morning releases
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch live RBA/ABS series
        run: python scripts/refresh_snapshot.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/snapshot)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snapshot
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes"
          fi
